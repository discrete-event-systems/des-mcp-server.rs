name: ORE MCP fleet admission

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcp-fleet-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out reviewed MCP fleet schema
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/mcp-rust-libs
          ref: ccdb56bedb7877dffc33c40f87cfed620c9aaba9
          path: .ore-mcp-runtime
          persist-credentials: false

      - name: Check out reviewed TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 597adfaa662eb2a02d91c28c03ba5e2a46870821
          path: .ore-tjsv
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0

      - name: Install reviewed TJSV dependency graph
        working-directory: .ore-tjsv
        run: npm ci

      - name: Validate MCP fleet manifest at build admission
        run: >-
          node .ore-tjsv/bin/config-shape.mjs
          --schema .ore-mcp-runtime/contracts/mcp-fleet/fleet.schema.json
          --instance contracts/mcp-fleet.json
          --mode build
