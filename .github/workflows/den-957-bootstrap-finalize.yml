name: DEN-957 one-shot bootstrap finalizer
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/den-957-bootstrap-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-957-adopt-bootstrap-a5c1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-957-adopt-bootstrap-a5c1
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Lock and validate
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --all-features --no-deps
          cargo build --locked --release --all-features
          grep -F 'a5c1ba9c50493ac625dd2fb175af21263d0d2801' Cargo.toml Cargo.lock
          git diff --check
      - name: Commit permanent head
        run: |
          set -euo pipefail
          git rm .github/workflows/den-957-bootstrap-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(DEN-957): adopt shared MCP bootstrap identity'
          git push origin HEAD:agent/den-957-adopt-bootstrap-a5c1
