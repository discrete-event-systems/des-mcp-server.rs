name: secrets-audit

# Fail closed without any decryption key. This checks repository hygiene,
# ignore policy, ciphertext structure, and recipient metadata only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  env-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned just
        env:
          JUST_VERSION: 1.51.0
          JUST_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
        run: |
          set -euo pipefail
          archive=/tmp/just.tar.gz
          url="https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-delay 1 \
            --output "$archive" "$url"
          printf '%s  %s\n' "$JUST_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Audit encrypted environment contract
        run: just env-check
