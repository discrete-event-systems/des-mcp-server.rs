name: DEN-957 shared bootstrap finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/den-957-shared-bootstrap-finalize.yml'

permissions:
  contents: write

concurrency:
  group: den-957-${{ github.repository }}-shared-bootstrap
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-957-shared-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-957-shared-bootstrap
          fetch-depth: 0
          persist-credentials: true
      - name: Install repository MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: rustfmt,clippy
      - name: Migrate telemetry policy to the immutable shared crate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          REV = "a5c1ba9c50493ac625dd2fb175af21263d0d2801"
          DEP = f'ore-mcp-bootstrap = {{ git = "https://github.com/ORESoftware/mcp-rust-libs", rev = "{REV}" }}'
          def replace_function(source: str, name: str, replacement: str | None) -> str:
              start = source.find(f"fn {name}")
              if start < 0: return source
              brace = source.find("{", start)
              if brace < 0: raise SystemExit(f"missing body for {name}")
              depth = 0
              for index in range(brace, len(source)):
                  if source[index] == "{": depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          while end < len(source) and source[end] == "\n": end += 1
                          return source[:start] + (replacement or "") + source[end:]
              raise SystemExit(f"unbalanced body for {name}")
          manifest_path = Path("Cargo.toml")
          manifest = manifest_path.read_text()
          if DEP not in manifest:
              marker = "[dependencies]\n"
              if marker not in manifest: raise SystemExit("Cargo.toml is missing [dependencies]")
              manifest = manifest.replace(marker, marker + DEP + "\n", 1)
          manifest_path.write_text(manifest)
          telemetry_path = Path("src/telemetry.rs")
          telemetry = telemetry_path.read_text()
          if "ServerIdentity::stdio" not in telemetry:
              init_start = telemetry.find("pub fn init(")
              if init_start < 0: raise SystemExit("telemetry init function is missing")
              init_brace = telemetry.find("{", init_start)
              if init_brace < 0: raise SystemExit("telemetry init body is missing")
              identity = ("\n    let identity =\n" "        ore_mcp_bootstrap::runtime::ServerIdentity::stdio(service_name, service_namespace)\n" "            .expect(\"static MCP service identity must be valid\");\n" "    let service_name = identity.service_name();\n" "    let service_namespace = identity.service_namespace();")
              telemetry = telemetry[:init_brace + 1] + identity + telemetry[init_brace + 1:]
          raw_limit = "MAX_RESOURCE_ATTRIBUTES_RAW_BYTES" if "MAX_RESOURCE_ATTRIBUTES_RAW_BYTES" in telemetry else "ore_mcp_bootstrap::telemetry::MAX_RESOURCE_ATTRIBUTE_BYTES"
          pair_limit = "MAX_RESOURCE_ATTRIBUTES" if "MAX_RESOURCE_ATTRIBUTES" in telemetry else "ore_mcp_bootstrap::telemetry::MAX_RESOURCE_ATTRIBUTE_PAIRS"
          reserved = "reserved_resource_attribute_key(&key)" if "fn reserved_resource_attribute_key" in telemetry else "matches!(key.as_str(), \"service.name\" | \"service.namespace\" | \"service.version\" | \"deployment.environment\" | \"k8s.namespace.name\" | \"k8s.pod.name\" | \"k8s.node.name\" | \"host.name\")"
          replacement = f'''fn resource_attribute_pairs(raw: &str) -> impl Iterator<Item = (String, String)> {{
              let mut attributes = Vec::new();
              if raw.len() > {raw_limit} {{ return attributes.into_iter(); }}
              let mut seen = std::collections::HashSet::new();
              for (key, value) in ore_mcp_bootstrap::telemetry::resource_attribute_pairs(raw) {{
                  if attributes.len() >= {pair_limit} {{ break; }}
                  if !{reserved} && seen.insert(key.clone()) {{ attributes.push((key, value)); }}
              }}
              attributes.into_iter()
          }}

          '''
          telemetry = replace_function(telemetry, "resource_attribute_pairs", replacement)
          telemetry = replace_function(telemetry, "valid_attribute_key", None)
          telemetry = replace_function(telemetry, "sensitive_attribute_key", None)
          telemetry = telemetry.replace("    collections::HashSet,\n", "")
          telemetry_path.write_text(telemetry)
          Path("tests").mkdir(exist_ok=True)
          Path("tests/shared_bootstrap_contract.rs").write_text(f'''const MANIFEST: &str = include_str!("../Cargo.toml");
          const TELEMETRY: &str = include_str!("../src/telemetry.rs");
          #[test]
          fn shared_bootstrap_dependency_is_immutable() {{
              assert!(MANIFEST.contains("ore-mcp-bootstrap"));
              assert!(MANIFEST.contains("rev = \\\"{REV}\\\""));
          }}
          #[test]
          fn production_telemetry_delegates_version_neutral_policy() {{
              assert!(TELEMETRY.contains("ore_mcp_bootstrap::telemetry::resource_attribute_pairs"));
              assert!(TELEMETRY.contains("ore_mcp_bootstrap::runtime::ServerIdentity::stdio"));
              assert!(!TELEMETRY.contains("fn valid_attribute_key"));
              assert!(!TELEMETRY.contains("fn sensitive_attribute_key"));
          }}
          ''')
          PY
      - name: Format, resolve, and validate the exact branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo build --release --locked
          git diff --check
          grep -F 'rev = "a5c1ba9c50493ac625dd2fb175af21263d0d2801"' Cargo.toml
          grep -F 'ore-mcp-bootstrap' Cargo.lock
      - name: Remove helper, commit, and push permanent review head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-957-shared-bootstrap-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor(DEN-957): adopt shared MCP bootstrap policy'
          git push origin HEAD:agent/den-957-shared-bootstrap
