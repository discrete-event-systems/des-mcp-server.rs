name: formal-hardening

on:
  pull_request:
    branches: [main, feat/bounded-formal-model-checker]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: formal-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-verifier:
    name: formal-verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - run: cargo test --locked --test formal_soundness
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
