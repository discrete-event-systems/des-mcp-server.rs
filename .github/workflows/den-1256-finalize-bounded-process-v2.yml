name: DEN-1256 finalize bounded subprocess capture v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/util.rs'
      - 'tests/bounded_process.rs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/den-1256-finalize-bounded-process.yml'
      - '.github/workflows/den-1256-finalize-bounded-process-v2.yml'

permissions:
  contents: write

concurrency:
  group: den-1256-finalize-bounded-process-v2
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'discrete-event-systems/des-mcp-server.rs' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'den-1248/audit-harden-test-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: den-1248/audit-harden-test-ci
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse stale or retargeted execution
        shell: bash
        run: |
          set -euo pipefail
          expected_main='e7a45c8b5d142022d8d852736d96905018c53e1c'
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git merge-base HEAD origin/main)" = "$expected_main"
          test "$(git branch --show-current)" = 'den-1248/audit-harden-test-ci'
          test -z "$(git status --porcelain)"

      - name: Validate workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: >-
            .github/workflows/ci.yml
            .github/workflows/web-smoke.yml
            .github/workflows/den-1256-finalize-bounded-process.yml
            .github/workflows/den-1256-finalize-bounded-process-v2.yml

      - name: Apply the reviewed bounded-capture transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/util.rs')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'use std::time::Duration;\n'
          import_replacement = 'use std::time::Duration;\n\nuse tokio::io::{AsyncRead, AsyncReadExt};\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('tokio IO import anchor drifted')
          text = text.replace(import_anchor, import_replacement, 1)

          start_marker = '/// Run a command with a timeout; returns (exit_ok, combined stdout+stderr).\n'
          end_marker = '\npub async fn git('
          if text.count(start_marker) != 1:
              raise SystemExit('legacy run_cmd start marker drifted')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = dedent('''\
          pub const MAX_COMMAND_STDOUT_BYTES: usize = 1024 * 1024;
          pub const MAX_COMMAND_STDERR_BYTES: usize = 256 * 1024;

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct CommandOutputLimits {
              pub timeout: Duration,
              pub max_stdout_bytes: usize,
              pub max_stderr_bytes: usize,
          }

          /// Run a command with a timeout and pre-buffer stdout/stderr ceilings.
          pub async fn run_cmd(
              dir: Option<&Path>,
              program: &str,
              args: &[&str],
              timeout: Duration,
          ) -> Result<(bool, String), String> {
              run_cmd_with_limits(
                  dir,
                  program,
                  args,
                  CommandOutputLimits {
                      timeout,
                      max_stdout_bytes: MAX_COMMAND_STDOUT_BYTES,
                      max_stderr_bytes: MAX_COMMAND_STDERR_BYTES,
                  },
              )
              .await
          }

          /// Concurrently drain both child pipes under explicit byte and time limits.
          /// The child is killed and reaped on timeout or the first over-limit byte.
          pub async fn run_cmd_with_limits(
              dir: Option<&Path>,
              program: &str,
              args: &[&str],
              limits: CommandOutputLimits,
          ) -> Result<(bool, String), String> {
              const MAX_CONFIGURED_CAPTURE: usize = 16 * 1024 * 1024;
              if limits.timeout.is_zero()
                  || !(1..=MAX_CONFIGURED_CAPTURE).contains(&limits.max_stdout_bytes)
                  || !(1..=MAX_CONFIGURED_CAPTURE).contains(&limits.max_stderr_bytes)
              {
                  return Err("invalid subprocess output limits".to_string());
              }

              let mut cmd = tokio::process::Command::new(program);
              cmd.args(args)
                  .stdin(std::process::Stdio::null())
                  .stdout(std::process::Stdio::piped())
                  .stderr(std::process::Stdio::piped())
                  .kill_on_drop(true);
              if let Some(dir) = dir {
                  cmd.current_dir(dir);
              }
              let mut child = cmd.spawn().map_err(|error| {
                  if error.kind() == std::io::ErrorKind::NotFound {
                      format!("`{program}` not found on PATH: {error}")
                  } else {
                      format!("failed to spawn {program}: {error}")
                  }
              })?;
              let stdout = child
                  .stdout
                  .take()
                  .ok_or_else(|| "subprocess stdout pipe is unavailable".to_string())?;
              let stderr = child
                  .stderr
                  .take()
                  .ok_or_else(|| "subprocess stderr pipe is unavailable".to_string())?;

              let operation = async {
                  let wait = async {
                      child
                          .wait()
                          .await
                          .map_err(|error| format!("{program} failed: {error}"))
                  };
                  let stdout = read_pipe_bounded(stdout, limits.max_stdout_bytes, "stdout");
                  let stderr = read_pipe_bounded(stderr, limits.max_stderr_bytes, "stderr");
                  tokio::try_join!(wait, stdout, stderr)
              };

              let result = tokio::time::timeout(limits.timeout, operation).await;
              let (status, stdout, stderr) = match result {
                  Ok(Ok(output)) => output,
                  Ok(Err(error)) => {
                      let _ = child.kill().await;
                      let _ = child.wait().await;
                      return Err(error);
                  }
                  Err(_) => {
                      let _ = child.kill().await;
                      let _ = child.wait().await;
                      return Err(format!("`{program}` timed out after {:?}", limits.timeout));
                  }
              };

              let mut text = String::from_utf8_lossy(&stdout).into_owned();
              let stderr = String::from_utf8_lossy(&stderr);
              if !stderr.trim().is_empty() {
                  text.push_str("\n--- stderr ---\n");
                  text.push_str(&stderr);
              }
              Ok((status.success(), text))
          }

          async fn read_pipe_bounded<R>(
              mut reader: R,
              limit: usize,
              stream_name: &str,
          ) -> Result<Vec<u8>, String>
          where
              R: AsyncRead + Unpin,
          {
              let mut output = Vec::new();
              let mut chunk = [0_u8; 8192];
              loop {
                  let read = reader
                      .read(&mut chunk)
                      .await
                      .map_err(|error| format!("reading subprocess {stream_name} failed: {error}"))?;
                  if read == 0 {
                      return Ok(output);
                  }
                  let next = output
                      .len()
                      .checked_add(read)
                      .ok_or_else(|| format!("subprocess {stream_name} length overflow"))?;
                  if next > limit {
                      return Err(format!(
                          "subprocess {stream_name} exceeded the {limit}-byte limit"
                      ));
                  }
                  output.extend_from_slice(&chunk[..read]);
              }
          }
          ''')
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Run the complete locked validation matrix
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps
          cargo build --locked --release
          cargo audit --deny warnings
          if git grep -nF 'wait_with_output()' -- src; then
            echo 'unbounded subprocess output buffering remains' >&2
            exit 1
          fi
          git grep -q 'run_cmd_with_limits' -- src/util.rs tests/bounded_process.rs
          git grep -q 'read_pipe_bounded' -- src/util.rs
          git grep -q 'kill_on_drop(true)' -- src/util.rs
          git diff --check

      - name: Remove one-shot carriers and publish the product branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-1256-finalize-bounded-process.yml
          rm .github/workflows/den-1256-finalize-bounded-process-v2.yml
          git add -A
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git commit -m 'fix(DEN-1256): bound subprocess output before buffering'
          git push origin HEAD:den-1248/audit-harden-test-ci
