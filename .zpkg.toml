[package]
org = "discrete-event-systems"
name = "des-mcp-server"
version = "0.1.0"
description = "Global stdio MCP tooling for the discrete-event-systems organization"
license = "MIT OR Apache-2.0"
keywords = ["mcp", "stdio", "simulation", "agents", "global-tool"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/discrete-event-systems/des-mcp-server.rs"

[build]
command = "cargo build --release --locked --bin des-mcp-server"
outputs = ["target/release/des-mcp-server"]

[bin]
des-mcp-server = "target/release/des-mcp-server"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo test --manifest-path \"$ZED_PKG_TEST_TARGET/Cargo.toml\" --all-targets --locked && test -x \"$ZED_PKG_TEST_TARGET/target/release/des-mcp-server\""
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
