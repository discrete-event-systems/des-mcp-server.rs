# Crate manifest for des-mcp-server — MCP (stdio) tools for the
# discrete-event-systems org (DES engine work under ~/codes/ores for now).
[package]
name = "des-mcp-server"
version = "0.1.0"
edition = "2024"
description = "MCP server for the discrete-event-systems org — read-only/build-only tools over the DES engine repos, sim-model inventory, engine docs, Supabase client telemetry, domains, and GitHub CI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/discrete-event-systems/des-mcp-server.rs"
homepage = "https://discrete-event-systems.github.io"

[lib]
name = "des_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "des-mcp-server"
path = "src/main.rs"

[dependencies]
ore-mcp-bootstrap = { git = "https://github.com/ORESoftware/mcp-rust-libs", rev = "a5c1ba9c50493ac625dd2fb175af21263d0d2801" }
anyhow = "1"
chrono = "0.4"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# Official Rust MCP SDK: stdio transport + #[tool] macros + schemars re-export.
rmcp = { version = "2.2", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DoH (1.1.1.1), RDAP, Cloudflare v4, GitHub Actions, Supabase PostgREST.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# "process" for cargo/tsc/git subprocesses, "time" for their timeouts.
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
